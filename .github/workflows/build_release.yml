name: Build & Release Multi-Model APKs

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "*"
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.model }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        model: [v6small, v6tiny]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Model Weights (${{ matrix.model }})
        run: |
          python scripts/download_models.py --model ${{ matrix.model }} --force

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > key.keystore
          echo "Keystore decoded successfully"

      - name: Build Release APKs (Multi-ABI Splits)
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PATH: key.keystore
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew assembleRelease -PsplitApks=true --stacktrace --no-daemon

      - name: Rename APKs with Model and ABI
        run: |
          mkdir -p release-apks
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              abi=""
              if [[ "$apk" == *"arm64-v8a"* ]]; then
                abi="arm64-v8a"
              elif [[ "$apk" == *"armeabi-v7a"* ]]; then
                abi="armeabi-v7a"
              elif [[ "$apk" == *"universal"* ]]; then
                abi="universal"
              else
                abi="all"
              fi
              new_name="PaddleOCR-Plugin-${{ matrix.model }}-${abi}-release.apk"
              cp "$apk" "../../../../../release-apks/$new_name"
              echo "Prepared $new_name"
            fi
          done

      - name: Upload Artifacts (${{ matrix.model }})
        uses: actions/upload-artifact@v4
        with:
          name: PaddleOCR-${{ matrix.model }}-APKs
          path: release-apks/*.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
