name: Build APK on Push

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build v6small arm64-v8a Debug APK
        run: ./gradlew assembleV6smallDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddleocr-v6small-arm64-v8a-debug
          path: app/build/outputs/apk/v6small/debug/*.apk
